# ---------------------------------------------------------------------------
# Infraestrutura como código para o Render.
#
# Cria o serviço web e o banco PostgreSQL gerenciado, com a URL de conexão
# injetada automaticamente. Os segredos marcados como `sync: false` são
# preenchidos por você no painel e NUNCA ficam no repositório.
# ---------------------------------------------------------------------------
databases:
  - name: icam-postgres
    databaseName: icam
    user: icam
    plan: basic-256mb          # ajuste conforme o volume
    postgresMajorVersion: "16"
    ipAllowList: []            # acesso somente pela rede interna do Render

services:
  - type: web
    name: icam
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci && npx tsx scripts/validar-taxonomia.ts && npm run build
    # As migrações rodam a cada implantação, antes de o servidor subir.
    preDeployCommand: npx tsx scripts/migrar.ts
    startCommand: npm start
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: icam-postgres
          property: connectionString
      - key: SESSAO_SEGREDO
        generateValue: true      # o Render gera um valor aleatório forte
      - key: PROVEDOR_IA
        value: deterministico
      - key: IA_ENVIO_EXTERNO_AUTORIZADO
        value: "false"
      - key: IA_RESIDENCIA_DADOS
        value: nao_definida
      - key: ANTHROPIC_API_KEY
        sync: false              # preencha no painel, se for usar o modelo externo
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
