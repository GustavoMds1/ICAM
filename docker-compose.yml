# Ambiente equivalente ao alvo de produção (PostgreSQL + MinIO).
# Desenvolvimento local não exige Docker: o padrão é SQLite (ver .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: icam
      POSTGRES_PASSWORD: icam
      POSTGRES_DB: icam
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U icam']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: icam
      MINIO_ROOT_PASSWORD: icamicam
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

volumes:
  pgdata:
  miniodata:
